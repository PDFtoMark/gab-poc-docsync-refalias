name: DocSync POC
on:
  issue_comment:
    types: [created]
jobs:
  docsync-comment:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '@docbot')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify PR Type
        id: verify-pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          set -e
          PR_DATA=$(gh api "/repos/$REPO_NAME/pulls/$PR_NUMBER")
          echo "pr_branch=$(echo "$PR_DATA" | jq -r .head.ref)" >> $GITHUB_OUTPUT
          echo "head_repo=$(echo "$PR_DATA" | jq -r '.head.repo.full_name')" >> $GITHUB_OUTPUT
          echo "head_repo=$(echo "$PR_DATA" | jq -r '.head.repo.full_name') branch=$(echo "$PR_DATA" | jq -r .head.ref)" >> $GITHUB_STEP_SUMMARY
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: ${{ steps.verify-pr.outputs.pr_branch }}
          fetch-depth: 0
      - name: Write docs and push
        run: |
          set -e
          echo "checked out branch=$(git rev-parse --abbrev-ref HEAD) sha=$(git rev-parse --short HEAD)"
          echo "<!-- fork PR docbot write; head_repo=${{ steps.verify-pr.outputs.head_repo }} -->" >> README.md
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "DocSync AI: Update documentation from @docbot command"
          git push origin HEAD
          echo "pushed branch=$(git rev-parse --abbrev-ref HEAD) sha=$(git rev-parse --short HEAD)"
